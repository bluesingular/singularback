# Nginx virtual host — app.swwarm.com
# Requires: certbot certificate already issued at /etc/letsencrypt/live/app.swwarm.com/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.swwarm.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — app.swwarm.com (customer portal)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.swwarm.com;

    ssl_certificate     /etc/letsencrypt/live/app.swwarm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.swwarm.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Max upload size (for multimodal attachments — G11)
    client_max_body_size 25M;

    # SSE — disable buffering so granular events stream live (M15)
    location /api/sse {
        proxy_pass         http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Cache-Control 'no-cache';
        proxy_set_header   X-Accel-Buffering 'no';
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket support (if needed for future features)
    location /ws {
        proxy_pass         http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # All other traffic
    location / {
        proxy_pass         http://app:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
